services:
  db:
    image: mysql:8.0
    container_name: astpp-db
    restart: unless-stopped
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--sql-mode="
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: astpp
      MYSQL_USER: astppuser
      MYSQL_PASSWORD: astpppass
    volumes:
      - db_data:/var/lib/mysql
      # Automatically initializes the schema on first startup:
      - ./database/astpp-6.0.sql:/docker-entrypoint-initdb.d/01_astpp-6.0.sql:ro
      - ./database/astpp-6.0.1.sql:/docker-entrypoint-initdb.d/02_astpp-6.0.1.sql:ro
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: astpp-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      # Mounts your local web_interface/astpp folder directly
      - ./web_interface/astpp:/var/www/html
      # Mounts the local config to the path ASTPP checks
      - ./docker/astpp-config.conf:/var/lib/astpp/astpp-config.conf:ro

volumes:
  db_data:
